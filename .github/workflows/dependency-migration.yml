name: ECHO 0.2 one-time dependency migration
on:
  push:
    branches: ['stabilization/echo-next-0.2']
    paths:
      - '.github/workflows/dependency-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'projects0002013-web/ECHO-NEXT-'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - name: Upgrade only audited vulnerable direct dependencies
        run: |
          npm install --save-exact zod@4.6.7
          npm install --save-dev --save-exact vitest@5.1.0
      - name: Validate migration
        run: |
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified dependency upgrade to stabilization branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add echo-next/package.json echo-next/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies are already up to date."
          else
            git commit -m "fix(security): upgrade vulnerable Vitest and Zod dependencies"
            git push origin HEAD:stabilization/echo-next-0.2
          fi
