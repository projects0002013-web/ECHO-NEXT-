name: CI and Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/ECHO-NEXT-/']
    env:
      VITE_BASE_PATH: ${{ matrix.base }}
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: echo-next/test-results/
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v4 installs sdkmanager and no longer requests Google's removed "tools" package.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - run: ./android/gradlew -p android assembleDebug lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-debug-${{ github.sha }}
          path: echo-next/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: echo-next/android/app/build/reports/lint-results-debug.*
