name: CI and Android APK
env:
  # The app uses ONNX Runtime Web. Skip onnxruntime-node's unrelated optional
  # CUDA binary download so CI remains deterministic on CPU runners.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - run: npm ci
      - name: Audit vulnerable dependencies
        run: npm audit --audit-level=moderate
  web:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        base: ["/", "/ECHO-NEXT-/"]
    env:
      VITE_BASE_PATH: ${{ matrix.base }}
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Cloudflare Pages compressed assets
        run: |
          npm run build:cloudflare
          node --input-type=module -e 'import { readdir, readFile, stat } from "node:fs/promises"; const files = await readdir("dist/assets"); const wasm = files.filter((name) => name.endsWith(".wasm")); if (!wasm.length) throw new Error("No ONNX Runtime WASM assets found"); for (const name of wasm) { const size = (await stat("dist/assets/" + name)).size; console.log(name + ": " + (size / 1024 / 1024).toFixed(2) + " MiB"); if (size > 25 * 1024 * 1024) throw new Error(name + " exceeds Cloudflare Pages 25 MiB limit"); } const headers = await readFile("dist/_headers", "utf8"); if (!headers.includes("Content-Encoding: gzip") || !headers.includes("Content-Type: application/wasm")) throw new Error("Cloudflare WASM headers are missing");'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: echo-next/test-results/
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # v4 installs sdkmanager and no longer requests Google's removed "tools" package.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run android:sync
      - run: ./android/gradlew -p android assembleDebug lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7
        with:
          name: ECHO-debug-${{ github.sha }}
          path: echo-next/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint
          path: echo-next/android/app/build/reports/lint-results-debug.*
