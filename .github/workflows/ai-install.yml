name: Install local AI speech dependency
on:
  push:
    branches: ['feature/echo-ai-voice-mvp']
    paths:
      - '.github/workflows/ai-install.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-next
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: echo-next/package-lock.json
      - name: Install pinned inference library
        run: |
          npm install --save-exact kokoro-js@1.2.1
          # Only the transitive Node image-processing package is overridden.
          npm pkg set 'overrides.sharp=0.35.5'
          npm install
      - name: Test dependency compatibility
        run: |
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Commit exact dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(ai): lock Kokoro neural inference dependency"
            git push origin HEAD:feature/echo-ai-voice-mvp
          fi
